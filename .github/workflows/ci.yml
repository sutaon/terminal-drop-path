name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Test
        shell: powershell
        run: .\tests\TerminalDropPath.Tests.ps1

      - name: Package
        shell: powershell
        run: .\package.ps1 -SkipBuild

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TerminalDropPath-v0.2.0-windows
          path: |
            dist/TerminalDropPath-v0.2.0-windows.zip
            dist/TerminalDropPath-v0.2.0-windows.zip.sha256
